<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Screen Management - EduSign Admin</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "error-container": "#93000a",
                    "tertiary": "#ffb95f",
                    "surface-dim": "#10131a",
                    "on-secondary-fixed": "#001f26",
                    "on-primary": "#1000a9",
                    "primary-fixed": "#e1e0ff",
                    "tertiary-fixed": "#ffddb8",
                    "secondary-fixed-dim": "#4cd7f6",
                    "error": "#ffb4ab",
                    "on-surface-variant": "#c7c4d7",
                    "on-secondary-fixed-variant": "#004e5c",
                    "surface-container": "#1d2026",
                    "on-surface": "#e1e2eb",
                    "secondary-container": "#03b5d3",
                    "on-error-container": "#ffdad6",
                    "inverse-surface": "#e1e2eb",
                    "tertiary-fixed-dim": "#ffb95f",
                    "secondary-fixed": "#acedff",
                    "surface-container-high": "#272a31",
                    "secondary": "#4cd7f6",
                    "inverse-primary": "#494bd6",
                    "on-tertiary-container": "#3e2400",
                    "surface-tint": "#c0c1ff",
                    "primary-fixed-dim": "#c0c1ff",
                    "primary-container": "#8083ff",
                    "tertiary-container": "#ca8100",
                    "on-primary-fixed-variant": "#2f2ebe",
                    "on-tertiary-fixed": "#2a1700",
                    "primary": "#c0c1ff",
                    "surface-container-highest": "#32353c",
                    "on-tertiary-fixed-variant": "#653e00",
                    "background": "#10131a",
                    "on-primary-fixed": "#07006c",
                    "surface-variant": "#32353c",
                    "on-secondary-container": "#00424e",
                    "on-background": "#e1e2eb",
                    "on-tertiary": "#472a00",
                    "outline-variant": "#464554",
                    "surface-bright": "#363940",
                    "on-primary-container": "#0d0096",
                    "surface-container-lowest": "#0b0e14",
                    "on-error": "#690005",
                    "surface-container-low": "#191c22",
                    "inverse-on-surface": "#2e3037",
                    "outline": "#908fa0",
                    "on-secondary": "#003640",
                    "surface": "#10131a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "24px",
                    "container-padding-desktop": "32px",
                    "unit": "8px",
                    "stack-md": "16px",
                    "stack-lg": "32px",
                    "container-padding-tablet": "24px",
                    "stack-sm": "8px"
            },
            "fontFamily": {
                    "display-lg": ["Inter"],
                    "code": ["Inter"],
                    "headline-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "code": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(21, 25, 33, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-card {
            background: #151921;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .glass-card:hover {
            border-color: rgba(192, 193, 255, 0.3); /* Primary color subtle highlight */
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0E14;
        }
        ::-webkit-scrollbar-thumb {
            background: #32353c;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #464554;
        }
        
        /* Status Animations */
        @keyframes pulse-emergency {
            0% { box-shadow: 0 0 0 0 rgba(255, 180, 171, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 180, 171, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 180, 171, 0); }
        }
        .status-pulse-emergency {
            animation: pulse-emergency 2s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-surface font-body-md min-h-screen flex flex-col md:hidden">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface w-full sticky top-0 z-50 border-b border-white/10 backdrop-blur-xl bg-surface/80 flex justify-between items-center px-gutter h-16">
<button class="text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined icon-fill">school</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary dark:text-primary tracking-tight">EduSign Admin</h1>
<button class="text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined icon-fill">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto pb-24 px-4 pt-4 space-y-unit">
<!-- Filter/Search Bar -->
<div class="glass-panel rounded-lg p-unit flex items-center gap-unit mb-stack-md sticky top-16 z-40">
<span class="material-symbols-outlined text-outline">search</span>
<input class="bg-transparent border-none focus:ring-0 text-on-surface font-body-md w-full placeholder-outline" placeholder="Filter devices..." type="text"/>
<button class="bg-surface-variant text-on-surface rounded p-1 flex items-center justify-center hover:bg-surface-bright transition-colors">
<span class="material-symbols-outlined text-[20px]">filter_list</span>
</button>
</div>
<!-- Quick Stats Bento -->
<div class="grid grid-cols-3 gap-unit mb-stack-md">
<div class="glass-card rounded-lg p-unit flex flex-col items-center justify-center">
<span class="font-headline-md text-headline-md-mobile text-on-surface">42</span>
<span class="font-label-md text-label-md text-outline">Total</span>
</div>
<div class="glass-card rounded-lg p-unit flex flex-col items-center justify-center border-t-2 border-t-[#4ade80]/50">
<span class="font-headline-md text-headline-md-mobile text-[#4ade80]">38</span>
<span class="font-label-md text-label-md text-outline">Online</span>
</div>
<div class="glass-card rounded-lg p-unit flex flex-col items-center justify-center border-t-2 border-t-error/50">
<span class="font-headline-md text-headline-md-mobile text-error">4</span>
<span class="font-label-md text-label-md text-outline">Offline</span>
</div>
</div>
<!-- Device List (High Density) -->
<div class="space-y-2">
<!-- Device Card: Online -->
<div class="glass-card rounded-lg p-3 flex items-center justify-between group active:scale-[0.98] transition-transform">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-[#4ade80] shadow-[0_0_8px_rgba(74,222,128,0.5)]"></div>
<div>
<h3 class="font-body-md text-body-md font-medium text-on-surface">Science Wing A</h3>
<p class="font-code text-code text-outline-variant">ID: SN-0142 • 1080p</p>
</div>
</div>
<div class="flex items-center gap-2">
<span class="bg-[#4ade80]/10 text-[#4ade80] font-label-md text-label-md px-2 py-0.5 rounded text-[10px]">SYNCED</span>
<button class="p-2 text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">more_vert</span>
</button>
</div>
</div>
<!-- Device Card: Offline (Warning) -->
<div class="glass-card rounded-lg p-3 flex items-center justify-between border-error/30 bg-error/5 group active:scale-[0.98] transition-transform">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-error status-pulse-emergency"></div>
<div>
<h3 class="font-body-md text-body-md font-medium text-on-surface">Main Cafeteria</h3>
<p class="font-code text-code text-error">Connection Lost (12m ago)</p>
</div>
</div>
<div class="flex items-center gap-2">
<button class="bg-error/20 text-error font-label-md text-label-md px-3 py-1.5 rounded-md flex items-center gap-1 active:bg-error/30 transition-colors border border-error/30">
<span class="material-symbols-outlined text-[16px]">bolt</span> Wake
                    </button>
</div>
</div>
<!-- Device Card: Online -->
<div class="glass-card rounded-lg p-3 flex items-center justify-between group active:scale-[0.98] transition-transform">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-[#4ade80] shadow-[0_0_8px_rgba(74,222,128,0.5)]"></div>
<div>
<h3 class="font-body-md text-body-md font-medium text-on-surface">Library Entrance</h3>
<p class="font-code text-code text-outline-variant">ID: SN-0091 • 4K</p>
</div>
</div>
<div class="flex items-center gap-2">
<span class="bg-[#4ade80]/10 text-[#4ade80] font-label-md text-label-md px-2 py-0.5 rounded text-[10px]">SYNCED</span>
<button class="p-2 text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">more_vert</span>
</button>
</div>
</div>
<!-- Device Card: Warning -->
<div class="glass-card rounded-lg p-3 flex items-center justify-between border-tertiary/30 group active:scale-[0.98] transition-transform">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-tertiary shadow-[0_0_8px_rgba(255,185,95,0.5)]"></div>
<div>
<h3 class="font-body-md text-body-md font-medium text-on-surface">Gymnasium North</h3>
<p class="font-code text-code text-tertiary">High Temp Warning (68°C)</p>
</div>
</div>
<div class="flex items-center gap-2">
<button class="bg-surface-variant text-on-surface font-label-md text-label-md px-3 py-1.5 rounded-md flex items-center gap-1 active:bg-surface-bright transition-colors">
<span class="material-symbols-outlined text-[16px]">restart_alt</span> Reboot
                    </button>
</div>
</div>
<!-- Device Card: Online -->
<div class="glass-card rounded-lg p-3 flex items-center justify-between group active:scale-[0.98] transition-transform">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-[#4ade80] shadow-[0_0_8px_rgba(74,222,128,0.5)]"></div>
<div>
<h3 class="font-body-md text-body-md font-medium text-on-surface">Admin Block Foyer</h3>
<p class="font-code text-code text-outline-variant">ID: SN-0002 • 1080p</p>
</div>
</div>
<div class="flex items-center gap-2">
<span class="bg-primary/10 text-primary font-label-md text-label-md px-2 py-0.5 rounded text-[10px]">UPDATING</span>
<button class="p-2 text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">more_vert</span>
</button>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface-container dark:bg-surface-container fixed bottom-0 w-full z-50 border-t border-white/5 backdrop-blur-lg bg-surface-container/90 shadow-lg flex justify-around items-center h-20 pb-safe px-2">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-white/5 active:scale-90 transition-transform duration-200 group">
<span class="material-symbols-outlined text-[24px] mb-1 group-hover:text-primary transition-colors">dashboard</span>
<span class="font-label-md text-label-md text-[10px] group-hover:text-primary transition-colors">Dashboard</span>
</button>
<!-- Active Tab: Screens -->
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-container text-on-secondary-container dark:text-on-secondary-container rounded-xl px-4 py-1 hover:bg-white/5 active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined icon-fill text-[24px] mb-1">monitor_heart</span>
<span class="font-label-md text-label-md text-[10px] font-bold">Screens</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-white/5 active:scale-90 transition-transform duration-200 group">
<span class="material-symbols-outlined text-[24px] mb-1 group-hover:text-primary transition-colors">settings_remote</span>
<span class="font-label-md text-label-md text-[10px] group-hover:text-primary transition-colors">Control</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-white/5 active:scale-90 transition-transform duration-200 group relative">
<span class="material-symbols-outlined text-[24px] mb-1 group-hover:text-primary transition-colors">warning</span>
<div class="absolute top-0 right-3 w-2 h-2 bg-error rounded-full status-pulse-emergency"></div>
<span class="font-label-md text-label-md text-[10px] group-hover:text-primary transition-colors">Alerts</span>
</button>
</nav>
<!-- pb-safe helper for devices with bottom safe areas (like iOS) -->
<style>
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</body></html>
