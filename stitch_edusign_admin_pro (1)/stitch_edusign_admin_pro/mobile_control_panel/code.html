<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduSign Admin - Mobile Control Panel</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#93000a",
                        "tertiary": "#ffb95f",
                        "surface-dim": "#10131a",
                        "on-secondary-fixed": "#001f26",
                        "on-primary": "#1000a9",
                        "primary-fixed": "#e1e0ff",
                        "tertiary-fixed": "#ffddb8",
                        "secondary-fixed-dim": "#4cd7f6",
                        "error": "#ffb4ab",
                        "on-surface-variant": "#c7c4d7",
                        "on-secondary-fixed-variant": "#004e5c",
                        "surface-container": "#1d2026",
                        "on-surface": "#e1e2eb",
                        "secondary-container": "#03b5d3",
                        "on-error-container": "#ffdad6",
                        "inverse-surface": "#e1e2eb",
                        "tertiary-fixed-dim": "#ffb95f",
                        "secondary-fixed": "#acedff",
                        "surface-container-high": "#272a31",
                        "secondary": "#4cd7f6",
                        "inverse-primary": "#494bd6",
                        "on-tertiary-container": "#3e2400",
                        "surface-tint": "#c0c1ff",
                        "primary-fixed-dim": "#c0c1ff",
                        "primary-container": "#8083ff",
                        "tertiary-container": "#ca8100",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "on-tertiary-fixed": "#2a1700",
                        "primary": "#c0c1ff",
                        "surface-container-highest": "#32353c",
                        "on-tertiary-fixed-variant": "#653e00",
                        "background": "#10131a",
                        "on-primary-fixed": "#07006c",
                        "surface-variant": "#32353c",
                        "on-secondary-container": "#00424e",
                        "on-background": "#e1e2eb",
                        "on-tertiary": "#472a00",
                        "outline-variant": "#464554",
                        "surface-bright": "#363940",
                        "on-primary-container": "#0d0096",
                        "surface-container-lowest": "#0b0e14",
                        "on-error": "#690005",
                        "surface-container-low": "#191c22",
                        "inverse-on-surface": "#2e3037",
                        "outline": "#908fa0",
                        "on-secondary": "#003640",
                        "surface": "#10131a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "container-padding-desktop": "32px",
                        "unit": "8px",
                        "stack-md": "16px",
                        "stack-lg": "32px",
                        "container-padding-tablet": "24px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter", "sans-serif"],
                        "code": ["Inter", "sans-serif"],
                        "headline-lg": ["Inter", "sans-serif"],
                        "label-md": ["Inter", "sans-serif"],
                        "headline-lg-mobile": ["Inter", "sans-serif"],
                        "headline-md": ["Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "code": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .pulse-bg {
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { background-color: rgba(147, 0, 10, 0.2); }
            50% { background-color: rgba(147, 0, 10, 0.6); }
            100% { background-color: rgba(147, 0, 10, 0.2); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface border-b border-white/10 backdrop-blur-xl bg-surface/80">
<div class="flex justify-between items-center px-gutter h-16">
<div class="flex items-center gap-unit cursor-pointer active:scale-95 transition-transform hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-primary dark:text-primary" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="font-headline-md text-headline-md-mobile text-primary dark:text-primary tracking-tight">EduSign Admin</span>
</div>
<div class="flex items-center">
<button class="active:scale-95 transition-transform hover:opacity-80 transition-opacity p-2 rounded-full">
<span class="material-symbols-outlined text-on-surface-variant dark:text-on-surface-variant">notifications</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-gutter py-stack-lg gap-stack-lg max-w-2xl mx-auto w-full pb-32">
<!-- Emergency Action Area -->
<section class="flex flex-col gap-stack-md">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Emergency Control</h2>
<button class="w-full bg-error-container text-on-error-container rounded-xl p-stack-lg flex flex-col items-center justify-center gap-stack-md shadow-2xl active:scale-95 transition-transform pulse-bg border border-error/30 relative overflow-hidden group">
<div class="absolute inset-0 bg-error opacity-0 group-hover:opacity-10 transition-opacity"></div>
<span class="material-symbols-outlined text-display-lg text-on-error-container" style="font-size: 64px; font-variation-settings: 'FILL' 1;">warning</span>
<span class="font-display-lg text-display-lg text-on-error-container text-center tracking-tight">EMERGENCY BROADCAST</span>
<span class="font-body-md text-body-md text-on-error-container/80 text-center">Overrides all screens immediately</span>
</button>
</section>
<!-- Push Message Input -->
<section class="flex flex-col gap-unit bg-surface-container rounded-xl p-stack-md border border-white/5 shadow-lg relative z-10 backdrop-blur-md">
<label class="font-label-md text-label-md text-on-surface-variant" for="push-message">Push Message Overide</label>
<textarea class="bg-surface-container-lowest text-on-background border border-outline-variant rounded-lg p-unit focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none font-body-md text-body-md resize-none transition-colors" id="push-message" placeholder="Enter message to display on all active screens..." rows="3"></textarea>
<div class="flex justify-end mt-unit">
<button class="bg-primary text-on-primary font-label-md text-label-md px-stack-md py-unit rounded-lg flex items-center gap-unit hover:bg-primary-container hover:text-on-primary-container active:scale-95 transition-all">
<span class="material-symbols-outlined" style="font-size: 20px;">send</span>
                    Push Now
                </button>
</div>
</section>
<!-- Global Controls Grid -->
<section class="grid grid-cols-2 gap-stack-md">
<button class="bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all rounded-xl p-stack-md flex flex-col items-center justify-center gap-unit border border-white/5 shadow-sm group">
<div class="p-unit rounded-full bg-surface-container-highest group-hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-primary" style="font-size: 32px;">sync</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Force Sync</span>
</button>
<button class="bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all rounded-xl p-stack-md flex flex-col items-center justify-center gap-unit border border-white/5 shadow-sm group">
<div class="p-unit rounded-full bg-surface-container-highest group-hover:bg-tertiary/20 transition-colors">
<span class="material-symbols-outlined text-tertiary" style="font-size: 32px;">restart_alt</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Global Restart</span>
</button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden fixed bottom-0 w-full z-50 bg-surface-container dark:bg-surface-container border-t border-white/5 backdrop-blur-lg bg-surface-container/90 shadow-lg">
<div class="flex justify-around items-center h-20 pb-safe px-2">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-white/5 active:scale-90 transition-transform duration-200 rounded-xl group" href="#">
<span class="material-symbols-outlined group-hover:text-secondary transition-colors" data-icon="dashboard">dashboard</span>
<span class="font-label-md text-label-md mt-1">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-white/5 active:scale-90 transition-transform duration-200 rounded-xl group" href="#">
<span class="material-symbols-outlined group-hover:text-secondary transition-colors" data-icon="monitor_heart">monitor_heart</span>
<span class="font-label-md text-label-md mt-1">Screens</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-container text-on-secondary-container dark:text-on-secondary-container rounded-xl px-4 py-1 active:scale-90 transition-transform duration-200 shadow-md" href="#">
<span class="material-symbols-outlined" data-icon="settings_remote" style="font-variation-settings: 'FILL' 1;">settings_remote</span>
<span class="font-label-md text-label-md mt-1 font-semibold">Control</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-white/5 active:scale-90 transition-transform duration-200 rounded-xl group" href="#">
<span class="material-symbols-outlined group-hover:text-secondary transition-colors" data-icon="warning">warning</span>
<span class="font-label-md text-label-md mt-1">Alerts</span>
</a>
</div>
</nav>
</body></html>
