<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CampusConnect - Emergency Alert</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Theme Config -->

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed": "#380d00",
                    "primary": "#b2c5ff",
                    "surface-container-lowest": "#0e0e0e",
                    "secondary-fixed-dim": "#00dbe7",
                    "on-background": "#e2e2e2",
                    "on-secondary": "#00363a",
                    "on-error": "#690005",
                    "surface": "#131313",
                    "on-surface": "#e2e2e2",
                    "on-surface-variant": "#c3c6d6",
                    "background": "#131313",
                    "error": "#ffb4ab",
                    "secondary": "#ddfcff",
                    "on-primary": "#002b73",
                    "tertiary-container": "#a33500",
                    "error-container": "#93000a",
                    "on-secondary-container": "#006a70",
                    "tertiary-fixed-dim": "#ffb59b",
                    "secondary-fixed": "#74f5ff",
                    "surface-bright": "#393939",
                    "on-primary-fixed-variant": "#0040a2",
                    "on-primary-fixed": "#001848",
                    "on-secondary-fixed-variant": "#004f54",
                    "primary-container": "#0052cc",
                    "on-tertiary-container": "#ffc6b2",
                    "surface-dim": "#131313",
                    "surface-container-highest": "#353535",
                    "surface-tint": "#b2c5ff",
                    "on-secondary-fixed": "#002022",
                    "surface-container-low": "#1b1b1b",
                    "on-primary-container": "#c4d2ff",
                    "on-error-container": "#ffdad6",
                    "surface-container": "#1f1f1f",
                    "primary-fixed": "#dae2ff",
                    "surface-variant": "#353535",
                    "tertiary-fixed": "#ffdbcf",
                    "on-tertiary-fixed-variant": "#812800",
                    "secondary-container": "#00f1fe",
                    "outline": "#8d90a0",
                    "surface-container-high": "#2a2a2a",
                    "inverse-on-surface": "#303030",
                    "on-tertiary": "#5b1a00",
                    "tertiary": "#ffb59b",
                    "primary-fixed-dim": "#b2c5ff",
                    "inverse-surface": "#e2e2e2",
                    "inverse-primary": "#0c56d0",
                    "outline-variant": "#434654"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "widget-padding": "40px",
                    "stack-gap": "24px",
                    "gutter-large": "48px",
                    "margin-page": "64px"
            },
            "fontFamily": {
                    "display-hero": [
                            "Inter"
                    ],
                    "label-caps": [

                    ],
                    "body-lg": [
                            "Inter"
                    ],
                    "headline-lg": [

                    ],
                    "display-title": [

                    ]
            },
            "fontSize": {
                    "display-hero": [
                            "120px",
                            {

                            }
                    ],
                    "label-caps": [

                            {

                    "display-title": [
                            "80px",

                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "700"
                            }
                    ]
            }
          },
        },
      }
    </script>
<style>
        /* Pulse Animation for Emergency Background */
        @keyframes emergencyPulse {
            0% { background-color: #93000a; } /* error-container */
            50% { background-color: #690005; } /* on-error */
            100% { background-color: #93000a; }
        }
        
        .bg-emergency-pulse {
            animation: emergencyPulse 1.5s infinite;
        }

        /* Scroller for Footer Ticker */
        @keyframes scrollTicker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        
        .animate-scroll {
            display: inline-block;
            white-space: nowrap;
            animation: scrollTicker 15s linear infinite;
        }

        /* Prevent scrolling on body during emergency override */
        body {
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen w-screen flex flex-col font-sans antialiased selection:bg-primary selection:text-on-primary">
<!-- 
        EMERGENCY OVERRIDE CANVAS 
        Suppresses all normal UI (TopAppBar, SideNavBar, standard Footer) 
        as per the "Semantic Shell Mandate: Automatic Suppression" rule.
    -->
<main class="flex-grow flex items-center justify-center bg-emergency-pulse z-[9999] p-margin-page relative overflow-hidden">
<!-- Animated Background Texture/Pattern for Intensity -->
<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);"></div>
<!-- Central Warning Container -->
<div class="flex flex-col items-center justify-center text-center z-10 max-w-[80vw] gap-stack-gap">
<!-- Huge Warning Icon -->
<span class="material-symbols-outlined text-white" style="font-size: 240px; font-variation-settings: 'FILL' 1, 'wght' 700;">
                warning
            </span>
<!-- Emergency Text -->
<!-- Using display-hero for max legibility at distance -->
<h1 class="font-display-hero text-display-hero text-white tracking-tighter uppercase drop-shadow-2xl">
                FIRE DRILL IN PROGRESS - PLEASE PROCEED TO NEAREST EXIT
            </h1>
</div>
</main>
<!-- 
        Emergency Footer Ticker 
        Replaces standard footer JSON due to Emergency Override.
    -->
<footer class="docked full-width bottom-0 h-24 bg-surface-container-lowest border-t border-outline-variant flat no shadows fixed left-0 w-full z-40 flex items-center px-margin-page overflow-hidden">
<div class="w-full overflow-hidden whitespace-nowrap flex items-center h-full">
<p class="font-headline-lg text-headline-lg text-error animate-scroll uppercase font-bold tracking-wider">
                EMERGENCY PROTOCOL ACTIVE | FOLLOW TEACHER INSTRUCTIONS | DO NOT USE ELEVATORS | PROCEED CALMLY TO DESIGNATED ASSEMBLY AREAS
            </p>
</div>
</footer>
</body></html>
