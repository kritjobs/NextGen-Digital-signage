plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.signage.player'
    compileSdk 35

    defaultConfig {
        applicationId "com.signage.player"
        minSdk 21          // Android 5.0 — supports most Android TV boxes
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        // TV-specific
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    // Allow cleartext for local network servers
    buildTypes.each {
        it.manifestPlaceholders = [usesCleartextTraffic: "true"]
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Leanback for Android TV
    implementation 'androidx.leanback:leanback:1.0.0'

    // ExoPlayer (Media3) — Hardware-accelerated video playback
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'

    // Glide for image loading with caching
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // OkHttp for downloading media & API calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON parsing — ใช้ org.json.JSONObject จาก Android SDK โดยตรง (ไม่ต้อง external dependency)

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // WebSocket client (for realtime commands)
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
}
